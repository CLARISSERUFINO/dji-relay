apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// The DJI App Key is tied to the package name com.rufino.djirelay. It is read from the
// user's ~/.gradle/gradle.properties (or the ORG_GRADLE_PROJECT_DJI_API_KEY environment
// variable) and is never committed. Without it the MSDK cannot register, so the build
// stops here instead of producing an APK that fails at runtime.
def djiApiKey = providers.gradleProperty('DJI_API_KEY').getOrNull()?.trim()
if (!djiApiKey) {
    throw new GradleException(
        "DJI_API_KEY is not set.\n" +
        "Add the line\n" +
        "    DJI_API_KEY=<your App Key>\n" +
        "to your user file ~/.gradle/gradle.properties (not the project's gradle.properties).\n" +
        "The key comes from developer.dji.com for package com.rufino.djirelay; see the README, " +
        "section 'Registering the app with DJI'.")
}

android {
    namespace 'com.rufino.djirelay'
    compileSdk Integer.parseInt(project.ANDROID_COMPILE_SDK_VERSION)
    // Pinned NDK, used by AGP to strip the native libraries of the MSDK.
    ndkVersion project.NDK_VERSION

    defaultConfig {
        applicationId 'com.rufino.djirelay'
        minSdk Integer.parseInt(project.ANDROID_MIN_SDK_VERSION)
        targetSdk Integer.parseInt(project.ANDROID_TARGET_SDK_VERSION)
        versionCode 1
        versionName '0.3.0-f3'
        manifestPlaceholders['API_KEY'] = djiApiKey
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // The MSDK ships protected classes; the sample does not shrink debug builds and
            // this project does not need shrinking at all.
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packagingOptions {
        // Several MSDK libraries bundle libc++_shared.so; keep one (as in the sample).
        pickFirst 'lib/arm64-v8a/libc++_shared.so'

        // Extract native libraries at install time (AGP 8 form, as in the 5.20.1
        // open-pilot-plugin-sample). The manifest also sets android:extractNativeLibs.
        jniLibs {
            useLegacyPackaging true
        }

        // Copied from SampleCode-V5's android-sdk-v5-sample/build.gradle.
        doNotStrip "*/*/libconstants.so"
        doNotStrip "*/*/libdji_innertools.so"
        doNotStrip "*/*/libdjibase.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIFlySafeCore-CSDK.so"
        doNotStrip "*/*/libdjifs_jni-CSDK.so"
        doNotStrip "*/*/libDJIRegister.so"
        doNotStrip "*/*/libdjisdk_jni.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core-CSDK.so"
        doNotStrip "*/*/libdjiwpv2-CSDK.so"
        doNotStrip "*/*/libFlightRecordEngine.so"
        doNotStrip "*/*/libvideo-framing.so"
        doNotStrip "*/*/libwaes.so"
        doNotStrip "*/*/libagora-rtsa-sdk.so"
        doNotStrip "*/*/libc++.so"
        doNotStrip "*/*/libc++_shared.so"
        doNotStrip "*/*/libmrtc_28181.so"
        doNotStrip "*/*/libmrtc_agora.so"
        doNotStrip "*/*/libmrtc_core.so"
        doNotStrip "*/*/libmrtc_core_jni.so"
        doNotStrip "*/*/libmrtc_data.so"
        doNotStrip "*/*/libmrtc_log.so"
        doNotStrip "*/*/libmrtc_onvif.so"
        doNotStrip "*/*/libmrtc_rtmp.so"
        doNotStrip "*/*/libmrtc_rtsp.so"
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // DJI MSDK v5 (spec 7.1)
    compileOnly deps.aircraftProvided
    implementation deps.aircraft
    runtimeOnly deps.networkImp
    implementation deps.xcrash
    implementation deps.rx3Kt
    implementation deps.documentfile

    // UI
    implementation platform(deps.composeBom)
    implementation deps.composeUi
    implementation deps.composeUiToolingPreview
    implementation deps.composeMaterial3
    implementation deps.activityCompose
    implementation deps.lifecycleRuntimeCompose
    implementation deps.coreKtx
    implementation deps.coroutinesAndroid
    debugImplementation deps.composeUiTooling
}
